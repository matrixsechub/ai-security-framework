name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # requirements.txt (crewai, pyautogen, chromadb, openai) is only needed
      # for live agent runs; the scaffold and tests are stdlib-only.
      - run: python -m pip install pytest
      - run: python -m compileall -q agent_config.py pipeline_scaffold.py prompt_templates.py
      - run: python -m pytest --tb=short
